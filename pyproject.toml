[project]
name = "wanda-structured"
version = "0.1.0"
description = "Wanda pruning re-implementation plus an activation-aware structured FFN-neuron extension"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "datasets", "accelerate"]

[project.scripts]
wanda-structured = "wanda_structured.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanda_structured"]

[tool.pytest.ini_options]
testpaths = ["tests"]
